<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./seatek.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Xem thông tin đơn hàng vận chuyển"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Soạn hàng</title>
    <script>
      // Ngăn chặn triệt để màn hình đỏ Uncaught Runtime Error do driver camera của Chromium
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('setphotooptions') !== -1 ||
                 str.indexOf('applyconstraints') !== -1 ||
                 str.indexOf('photo options') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (shouldSuppress(msg) || (reason && reason.name === 'DOMException' && shouldSuppress(reason.message))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.warn('Đã bỏ qua lỗi camera không nghiêm trọng của trình duyệt:', msg);
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (shouldSuppress(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.warn('Đã bỏ qua lỗi camera không nghiêm trọng của trình duyệt:', msg);
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
